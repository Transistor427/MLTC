[minimum_layer_time_control]
min_layer_time: 20
park_x: 0
park_y: 0
z_hop: 5
travel_speed: 150
z_speed: 15

[gcode_macro MLTC_ENABLE]
description: Включить контроль минимального времени слоя
gcode:
    MINIMUM_LAYER_TIME_CONTROL_ENABLE

[gcode_macro MLTC_DISABLE]
description: Выключить контроль минимального времени слоя
gcode:
    MINIMUM_LAYER_TIME_CONTROL_DISABLE

[gcode_macro CHANGE_MLTC]
description: При нажатии изменяет состояние контроля минимального времени слоя
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if not svv.change_mltc|default(False) %}
        RESPOND PREFIX="[+]" MSG="Контроль времени слоя активирован"
        SAVE_VARIABLE VARIABLE=change_mltc VALUE=True
        MINIMUM_LAYER_TIME_CONTROL_ENABLE
    {% else %}
        RESPOND PREFIX="[+]" MSG="Контроль времени слоя отключен"
        SAVE_VARIABLE VARIABLE=change_mltc VALUE=False
        MINIMUM_LAYER_TIME_CONTROL_DISABLE
    {% endif %}
